<main class="dashboard-wrapper">
  <header class="dashboard-header">
    <h1 class="dashboard-heading">Hero Command Deck</h1>
    <p class="dashboard-subheading">Class Assignment 1 &bull; {{ title }}</p>
  </header>

  <div class="dashboard-grid">
    <!-- Component 1: User Card with Level and Stat Events -->
    <app-user-card
      [heroData]="heroCharacter"
      (levelUpRequested)="handleLevelUp()"
      (statIncreased)="handleStatIncrease($event)"
    ></app-user-card>

    <div class="side-column">
      <!-- Component 2: User Status Toggle -->
      <app-user-status
        [currentStatus]="heroCharacter.currentStatus"
        (statusChanged)="handleStatusUpdate($event)"
      ></app-user-status>

      <!-- Component 3: User Bio & Lore -->
      <app-user-bio
        [backstory]="heroCharacter.characterBackstory"
        (backstoryUpdated)="handleBackstoryUpdate($event)"
      ></app-user-bio>
    </div>
  </div>
</main>
